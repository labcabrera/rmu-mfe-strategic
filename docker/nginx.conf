# Serves the strategic remote. The shell loads strategic-app.js and its chunks from /mfe/strategic/ through the
# gateway, which strips the prefix. Chunk names carry no content hash yet, so every file is
# revalidated (ETag) instead of being cached as immutable.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location / {
    add_header Cache-Control "no-cache" always;
    # Lets the remote also be loaded from another origin (dev shell, CDN).
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri $uri/ /index.html;
  }
}
