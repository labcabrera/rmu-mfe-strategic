# Serves the strategic remote. The shell loads strategic-app.js and its chunks from /mfe/strategic/ through the
# gateway, which strips the prefix. strategic-app.js and env-config.js keep their name, so they are revalidated (ETag);
# the chunks can be cached for good. What does not exist is a 404: a remote has no page to fall back to.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Workspace spec 091, E5: the name of a chunk carries the hash of its content.
  location ~ "\.[0-9a-f]{20}\.js$" {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    # Lets the remote also be loaded from another origin (dev shell, CDN).
    add_header Access-Control-Allow-Origin "*" always;
    try_files $uri =404;
  }
}
